<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنصة التعليمية</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--pr:#3b5bdb;--bd:#e1e5ef}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b202c;--tx:#eef1f8;--mu:#97a0b5;--pr:#7c93ff;--bd:#2b3244}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.6}
.w{max-width:600px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
h1{font-size:22px;margin:8px 0}h2{font-size:18px;margin:4px 0 8px}
input,select,button,textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0}
button{background:var(--pr);color:#fff;border:0;cursor:pointer;font-weight:bold}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.x{background:#e03131}
.opt{display:block;text-align:right;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:16px;font-size:17px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between}.bar button{width:auto;padding:8px 14px}
.mu{color:var(--mu);font-size:14px}.err{color:#e03131;font-size:14px;min-height:20px}
img,video{max-width:100%;border-radius:10px}.blk{white-space:pre-wrap}.row{display:flex;gap:8px}.row>*{flex:1}
progress{width:100%}.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{padding:10px}
.b{font-size:12px;padding:2px 8px;border-radius:99px;background:#2f9e44;color:#fff;margin-inline-start:6px}
.b.suspended{background:#f08c00}.b.banned{background:#e03131}.b.sup{background:#7048e8}
.view{background:#f08c00;color:#fff;border-radius:10px;padding:8px 12px;margin:8px 0}
.view button{background:#fff;color:#000;width:auto;padding:4px 10px;margin:0 8px}
</style></head><body><div class="w" id="app">جاري التحميل...</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,query,where,onSnapshot,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 👇 الصق إعدادات مشروعك من Firebase Console
const firebaseConfig={apiKey:"AIzaSyAhYZwzk9dT9xoD8BhLisYLwkfgFHh0neY",authDomain:"learn-with-me-c41e0.firebaseapp.com",projectId:"learn-with-me-c41e0",storageBucket:"learn-with-me-c41e0.firebasestorage.app",messagingSenderId:"527369712701",appId:"1:527369712701:web:a4f5b1c021d0701f9da654"};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const GRADES=["أولى إعدادي","تانية إعدادي","تالتة إعدادي","أولى بكالوريا"];
const subjects=g=>["عربي",g==="أولى بكالوريا"?"علوم متكاملة":"علوم","دراسات"];
const S={u:null,role:null,me:null,profile:null,block:null,grade:null,subject:null,lesson:null,lessons:[],
  tab:"content",students:[],admins:[],viewAs:null,q:"",ready:false};
let unL=null,unP=null,unT=null;
const W=window,$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg=m=>{const e=$("er");if(e)e.textContent=m};
const canEdit=()=>S.role&&!S.viewAs, isSuper=()=>S.role==="super"&&!S.viewAs;
const stop=f=>{if(f){f()}};

onAuthStateChanged(auth,async u=>{
  stop(unP);unP=null;stop(unT);unT=null;stop(unL);unL=null;
  Object.assign(S,{u,role:null,me:null,profile:null,block:null,viewAs:null,tab:"content",ready:true});
  if(!u){S.grade=S.subject=S.lesson=null;return render()}
  let a=null;try{a=await getDoc(doc(db,"admins",u.uid))}catch(e){}
  if(a&&a.exists()){
    if(a.data().active===false){S.block="disabled";return render()}
    S.role=a.data().role==="super"?"super":"editor";S.me=a.data();S.grade=S.grade||GRADES[0];return render();
  }
  unP=onSnapshot(doc(db,"users",u.uid),s=>{
    S.profile=s.exists()?s.data():null;const t=S.profile?.status;
    S.block=(t==="banned"||t==="suspended")?t:null;
    if(S.profile&&!S.grade&&S.profile.grade)S.grade=S.profile.grade;
    if(S.block){stop(unL);unL=null}
    render();
  },()=>{});
});

function listen(){
  stop(unL);unL=null;S.lessons=[];
  if(!S.grade||!S.subject||S.block)return;
  unL=onSnapshot(query(collection(db,"lessons"),where("grade","==",S.grade),where("subject","==",S.subject)),
    sn=>{S.lessons=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));render()},()=>{});
}
function tab(t){
  S.tab=t;S.lesson=null;stop(unT);unT=null;
  if(t==="students")unT=onSnapshot(collection(db,"users"),sn=>{S.students=sn.docs.map(d=>({id:d.id,...d.data()}));render()});
  if(t==="admins")unT=onSnapshot(collection(db,"admins"),sn=>{S.admins=sn.docs.map(d=>({id:d.id,...d.data()}));render()});
  render();
}
const top=()=>`<div class="bar"><span class="mu">${esc(S.role?S.me?.name||"أدمن":S.profile?.name||"")}${S.role?`<span class="b ${S.role==="super"?"sup":""}">${S.role==="super"?"أدمن رئيسي":"أدمن محتوى"}</span>`:""}</span><button class="s" onclick="out()">خروج</button></div>`;
const back=t=>`<button class="s" onclick="go('${t}')">رجوع ←</button>`;
const ST={active:"نشط",suspended:"موقوف",banned:"مطرود"};

function render(){
  const a=$("app");if(!S.ready)return;
  if(!S.u)return a.innerHTML=`<h1>أهلاً بيك 👋</h1>
  <div class="card"><button onclick="google()">🔐 تسجيل الدخول بحساب جوجل</button><div class="err" id="er"></div></div>
  <details class="card"><summary>دخول الأدمن</summary>
  <input id="ae" type="email" dir="ltr" placeholder="إيميل الأدمن"><input id="ap" type="password" dir="ltr" placeholder="الباسورد">
  <button class="s" onclick="adm()">دخول</button><div class="err" id="er2"></div></details>`;
  if(S.block){const m={banned:"🚫 تم طرد حسابك من المنصة.",suspended:"⏸️ حسابك موقوف حالياً. تواصل مع الإدارة.",disabled:"⏸️ حساب الأدمن موقوف."}[S.block];
    return a.innerHTML=`<div class="card"><h2>${m}</h2><button class="s" onclick="out()">خروج</button></div>`}
  if(!S.role&&!S.profile)return a.innerHTML=`<h1>اكتب اسمك</h1><div class="card">
  <input id="nm" placeholder="الاسم (ممكن يتكرر)"><button onclick="saveName()">متابعة</button><div class="err" id="er"></div></div>`;
  const p=S.profile;
  if(!S.role&&p.warnTs&&(!p.warnSeenTs||p.warnSeenTs<p.warnTs))
    return a.innerHTML=`<div class="card"><h2>⚠️ تحذير من الإدارة</h2><p class="blk">${esc(p.warnText)}</p><button onclick="ack()">تم الاطلاع</button></div>`;
  const view=S.viewAs?`<div class="view">👁️ معاينة كأنك: ${esc(S.viewAs.name)}<button onclick="exitView()">خروج من المعاينة</button></div>`:"";
  let tabs="";
  if(S.role&&!S.viewAs)tabs=`<div class="tabs"><button class="${S.tab==="content"?"":"s"}" onclick="tab('content')">📚 المحتوى</button>`+
    (S.role==="super"?`<button class="${S.tab==="students"?"":"s"}" onclick="tab('students')">👥 الطلاب</button><button class="${S.tab==="admins"?"":"s"}" onclick="tab('admins')">🛡️ الأدمنز</button>`:"")+`</div>`;
  const head=top()+view+tabs;
  if(isSuper()&&S.tab==="students")return a.innerHTML=head+studentsUI();
  if(isSuper()&&S.tab==="admins")return a.innerHTML=head+adminsUI();
  if(!S.grade)return a.innerHTML=head+`<h1>انت سنة كام؟</h1>`+GRADES.map(g=>`<button class="opt" onclick="pick('${g}')">${g}</button>`).join("");
  if(!S.subject)return a.innerHTML=head+`<div class="bar"><h1>${S.grade}</h1><button class="s" onclick="setG()">تغيير السنة</button></div>`+
    subjects(S.grade).map(s=>`<button class="opt" onclick="subj('${s}')">${s}</button>`).join("");
  if(!S.lesson)return a.innerHTML=head+`<div class="bar"><h1>${S.subject}</h1>${back("subj")}</div>`+
    (S.lessons.length?S.lessons.map(l=>`<button class="opt" onclick="openL('${l.id}')">📘 ${esc(l.title)}</button>`).join(""):`<p class="mu">لسه مفيش دروس.</p>`)+
    (canEdit()?`<button onclick="addLesson()" style="font-size:20px">＋ إضافة درس</button>`:"");
  const l=S.lessons.find(x=>x.id===S.lesson);if(!l){S.lesson=null;return render()}
  a.innerHTML=head+`<div class="bar"><h1>${esc(l.title)}</h1>${back("list")}</div>`+
  (l.blocks||[]).map((b,i)=>`<div class="card"><div class="blk">${blk(b)}</div>${canEdit()?`<button class="x" onclick="delBlk(${i})">حذف</button>`:""}</div>`).join("")+
  (canEdit()?`<div class="card"><h2>إضافة محتوى</h2><textarea id="tx" rows="3" placeholder="اكتب نص..."></textarea>
  <button onclick="addText()">إضافة النص</button>
  <input id="lk" dir="ltr" placeholder="رابط يوتيوب أو جوجل درايف (فيديو / PDF / صورة)">
  <button class="s" onclick="addLink()">🔗 إضافة الرابط</button>
  <div class="err" id="er"></div>
  <button class="x" onclick="delLesson()">حذف الدرس</button></div>`:"");
}
function studentsUI(){
  const q=S.q.toLowerCase();
  const L=S.students.filter(s=>!q||(s.name||"").toLowerCase().includes(q)||(s.email||"").toLowerCase().includes(q));
  return `<h1>الطلاب (${S.students.length})</h1><input placeholder="بحث بالاسم أو الإيميل" value="${esc(S.q)}" onchange="S_q(this.value)">`+
  (L.map(s=>{const t=s.status||"active";return `<div class="card"><b>${esc(s.name)}</b><span class="b ${t}">${ST[t]}</span>
  <div class="mu" dir="ltr" style="text-align:right">${esc(s.email)}</div><div class="mu">${esc(s.grade||"لم يحدد السنة")} • تحذيرات: ${s.warnCount||0}</div>
  <div class="row"><button class="s" onclick="act('warn','${s.id}')">⚠️ تحذير</button><button class="s" onclick="act('view','${s.id}')">👁️ معاينة</button></div>
  <div class="row">${t==="active"?`<button class="s" onclick="act('suspended','${s.id}')">⏸️ إيقاف</button>`:`<button class="s" onclick="act('active','${s.id}')">▶️ تفعيل</button>`}
  ${t!=="banned"?`<button class="x" onclick="act('banned','${s.id}')">🚫 طرد</button>`:""}
  <button class="x" onclick="act('del','${s.id}')">🗑️</button></div></div>`}).join("")||`<p class="mu">لا يوجد طلاب.</p>`);
}
function adminsUI(){
  return `<h1>الأدمنز</h1><div class="card"><h2>إضافة أدمن</h2>
  <input id="an" placeholder="الاسم"><input id="ae2" type="email" dir="ltr" placeholder="الإيميل"><input id="ap2" type="password" dir="ltr" placeholder="باسورد (6 أحرف+)">
  <select id="ar"><option value="editor">أدمن محتوى</option><option value="super">أدمن رئيسي</option></select>
  <button onclick="addAdmin()">إضافة</button><div class="err" id="er"></div></div>`+
  S.admins.map(x=>{const me=x.id===S.u.uid;return `<div class="card"><b>${esc(x.name||"")}</b>
  <span class="b ${x.role==="super"?"sup":""}">${x.role==="super"?"رئيسي":"محتوى"}</span>${x.active===false?`<span class="b suspended">موقوف</span>`:""}${me?" (أنت)":""}
  <div class="mu" dir="ltr" style="text-align:right">${esc(x.email||"")}</div>
  ${me?"":`<div class="row"><button class="s" onclick="admAct('role','${x.id}')">تغيير الدور</button>
  <button class="s" onclick="admAct('active','${x.id}')">${x.active===false?"تفعيل":"إيقاف"}</button><button class="x" onclick="admAct('del','${x.id}')">حذف</button></div>`}</div>`}).join("");
}
function emb(u){
  let m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  if(m)return `<iframe src="https://www.youtube.com/embed/${m[1]}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px" allowfullscreen></iframe>`;
  m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);
  if(m&&u.includes("drive.google"))return `<iframe src="https://drive.google.com/file/d/${m[1]}/preview" style="width:100%;height:480px;border:0;border-radius:10px" allowfullscreen></iframe>`;
  return `<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--pr)">🔗 ${esc(u)}</a>`;
}
function blk(b){
  if(b.type==="text")return esc(b.text??b.value);
  if(b.type==="link")return emb(b.url);
  if(b.type==="image")return `<img src="${esc(b.url)}" alt="">`;
  if(b.type==="video")return `<video src="${esc(b.url)}" controls playsinline></video>`;
  return `<a href="${esc(b.url)}" target="_blank" rel="noopener" style="color:var(--pr)">📄 ${esc(b.name||"ملف PDF")}</a>`;
}
const curL=()=>S.lessons.find(x=>x.id===S.lesson);
async function setBlocks(f){const b=[...(curL().blocks||[])];f(b);try{await updateDoc(doc(db,"lessons",S.lesson),{blocks:b})}catch(e){msg("تعذر الحفظ")}}
W.S_q=v=>{S.q=v;render()};
W.tab=tab;
W.google=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){msg("تعذر تسجيل الدخول")}};
W.adm=async()=>{try{await signInWithEmailAndPassword(auth,$("ae").value.trim(),$("ap").value)}catch(e){$("er2").textContent="بيانات غلط"}};
W.out=()=>signOut(auth);
W.saveName=async()=>{const n=$("nm").value.trim();if(n.length<2)return msg("اكتب اسمك");
  try{await setDoc(doc(db,"users",S.u.uid),{name:n,email:S.u.email||"",status:"active",createdAt:Date.now()})}catch(e){msg("تعذر الحفظ")}};
W.ack=()=>updateDoc(doc(db,"users",S.u.uid),{warnSeenTs:S.profile.warnTs});
W.pick=g=>{S.grade=g;S.subject=null;if(!S.role&&!S.viewAs)updateDoc(doc(db,"users",S.u.uid),{grade:g}).catch(()=>{});render()};
W.setG=()=>{S.grade=null;S.subject=null;listen();render()};
W.subj=s=>{S.subject=s;listen();render()};
W.go=t=>{if(t==="subj"){S.subject=null;listen()}if(t==="list")S.lesson=null;render()};
W.openL=id=>{S.lesson=id;render()};
W.addLesson=async()=>{const t=prompt("اسم الدرس؟");if(!t)return;const id="l"+Date.now();
  await setDoc(doc(db,"lessons",id),{title:t.trim(),grade:S.grade,subject:S.subject,blocks:[],ts:Date.now()});S.lesson=id;render()};
W.addText=()=>{const v=$("tx").value.trim();if(v)setBlocks(b=>b.push({type:"text",text:v}))};
W.delBlk=i=>{if(confirm("حذف؟"))setBlocks(b=>b.splice(i,1))};
W.delLesson=async()=>{if(confirm("حذف الدرس؟")){await deleteDoc(doc(db,"lessons",S.lesson));S.lesson=null;render()}};
W.addLink=()=>{const u=$("lk").value.trim();if(!/^https?:\/\//.test(u))return msg("الصق رابط صحيح");setBlocks(b=>b.push({type:"link",url:u}))};
// ===== تحكم الأدمن الرئيسي في الطلاب =====
W.act=async(k,id)=>{
  if(S.role!=="super")return;
  const s=S.students.find(x=>x.id===id),r=doc(db,"users",id);
  try{
    if(k==="warn"){const t=prompt("نص التحذير؟");if(t)await updateDoc(r,{warnText:t.trim(),warnTs:Date.now(),warnCount:increment(1)})}
    else if(k==="view"){S.viewAs=s;S.grade=s.grade||GRADES[0];S.subject=S.lesson=null;S.tab="content";stop(unT);unT=null;listen()}
    else if(k==="del"){if(confirm("حذف الطالب؟ (الأفضل الطرد بدل الحذف)"))await deleteDoc(r)}
    else if(k==="banned"){if(confirm("طرد الطالب؟"))await updateDoc(r,{status:"banned"})}
    else await updateDoc(r,{status:k});
  }catch(e){alert("تعذر تنفيذ الإجراء")}
  render();
};
W.exitView=()=>{S.viewAs=null;S.grade=GRADES[0];S.subject=null;listen();tab("students")};
// ===== تحكم الأدمن الرئيسي في الأدمنز =====
W.addAdmin=async()=>{
  const name=$("an").value.trim(),email=$("ae2").value.trim(),pw=$("ap2").value,role=$("ar").value;
  if(!name||!email||pw.length<6)return msg("كمّل البيانات");
  try{const sec=initializeApp(firebaseConfig,"sec"+Date.now()),sa=getAuth(sec);
    const c=await createUserWithEmailAndPassword(sa,email,pw);await signOut(sa);
    await setDoc(doc(db,"admins",c.user.uid),{name,email,role,active:true,createdAt:Date.now()});
    msg("تمت الإضافة ✅");["an","ae2","ap2"].forEach(i=>$(i).value="");
  }catch(e){msg("تعذرت الإضافة: "+(e.code||""))}
};
W.admAct=async(k,id)=>{
  const x=S.admins.find(a=>a.id===id),r=doc(db,"admins",id);
  try{
    if(k==="role")await updateDoc(r,{role:x.role==="super"?"editor":"super"});
    if(k==="active")await updateDoc(r,{active:x.active===false});
    if(k==="del"&&confirm("حذف الأدمن؟"))await deleteDoc(r);
  }catch(e){alert("تعذر تنفيذ الإجراء")}
};
</script></body></html>
